* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;

body {
    background: #f5f7fb;
    color: #222;
}

.sidebar {
    position: fixed;
    width: 230px;

.logo {

    display: flex;
    justify-content: space-between;

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    margin-bottom: 30px;
}

}

    font-size: 14px;
    margin-bottom: 10px;
}

.number {
    font-size: 28px;
    font-weight: bold;
}

    padding: 25px;
